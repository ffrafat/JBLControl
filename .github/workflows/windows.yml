# Builds and tests the Windows port (windows/), and packages its installers and zips on version tags.
name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'windows/**'
      - 'scripts/build-windows.ps1'
      - 'Resources/Info.plist'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'scripts/build-windows.ps1'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'Resources/Info.plist'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Builds the whole solution (the WinUI app included) and runs the protocol tests,
      # the same byte-for-byte fixtures as the Swift tests.
      - name: Build and test
        run: dotnet test windows/JBLControl.Windows.slnx -c Release

  package:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write # to attach the assets to the tag's release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Inno Setup builds the installers; most runner images include it, so only install it when missing.
      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build x64 and arm64 installers and zips
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Installer -Zip
      - uses: actions/upload-artifact@v4
        with:
          name: JBLControl-windows
          path: |
            build/JBLControl-win-*-setup.exe
            build/JBLControl-win-*.zip
            build/JBLControl-win-*.sha256
          if-no-files-found: error
      # On a version tag: attach the Windows files to that tag's release, creating it as a draft (from
      # .github/release-template.md) if it doesn't exist yet. The Mac DMG is built and attached on a Mac;
      # publish the draft once both are there.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false # "release not found" is an expected exit code here
          $version = $env:TAG.TrimStart('v')
          $files = Get-ChildItem build/JBLControl-win-*-setup.exe, build/JBLControl-win-*.zip, build/JBLControl-win-*.sha256 |
            ForEach-Object FullName
          gh release view $env:TAG --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            $sums = (Get-Content -Raw "build/JBLControl-win-$version.sha256").Trim()
            (Get-Content -Raw .github/release-template.md).Replace('{VERSION}', $version).Replace('{CHECKSUMS}', $sums) |
              Set-Content build/release-notes.md
            gh release create $env:TAG --draft --verify-tag --title "JBLControl $version" --notes-file build/release-notes.md
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload $env:TAG @files --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
