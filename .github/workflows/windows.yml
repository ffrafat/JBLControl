# Builds and tests the Windows port (windows/), and packages its release zips on version tags.
name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'windows/**'
      - 'scripts/build-windows.ps1'
      - 'Resources/Info.plist'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'scripts/build-windows.ps1'
      - 'Resources/Info.plist'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Builds the whole solution (the WinUI app included) and runs the protocol tests,
      # the same byte-for-byte fixtures as the Swift tests.
      - name: Build and test
        run: dotnet test windows/JBLControl.Windows.slnx -c Release

  package:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build x64 and arm64 zips
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Zip
      - uses: actions/upload-artifact@v4
        with:
          name: JBLControl-windows
          path: |
            build/JBLControl-win-*.zip
            build/JBLControl-win-*.sha256
          if-no-files-found: error
